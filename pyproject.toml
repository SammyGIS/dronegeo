[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dronegeo"
readme = { file = "README.md", content-type = "text/markdown" }
version = "0.1.2"
description = "A high-performance Python library for drone remote sensing, UAV LiDAR point cloud processing, terrain anomaly diagnostics, and continuous DEM generation."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "SammyGIS", email = "sammygis@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "laspy>=2.5.0",
    "lazrs>=0.8.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/SammyGIS/dronegeo"
Documentation = "https://dronegeo.readthedocs.io"
"GitHub Pages" = "https://sammygis.github.io/dronegeo/"
Repository = "https://github.com/SammyGIS/dronegeo.git"
Issues = "https://github.com/SammyGIS/dronegeo/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dronegeo*"]

[tool.setuptools.package-data]
dronegeo = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
