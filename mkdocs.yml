site_name: DroneGeo Documentation
site_description: High-Performance Python Remote Sensing, UAV LiDAR, Hydrological Flow & Photogrammetry Processing Toolkit
site_author: SammyGIS / DroneGeo Contributors
site_url: https://sammygis.github.io/dronegeo/
repo_url: https://github.com/SammyGIS/dronegeo
repo_name: SammyGIS/dronegeo

theme:
  name: material
  logo: images/dronegeo.png
  favicon: images/dronegeo.png
  palette:
    # 1. Dark mode (DEFAULT)
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # 2. Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Beginner Quickstart: quickstart.md
  - AutoQC & Quality Inspection: autoqc.md
  - Surface Models (DTM, DSM, CHM): surfaces.md
  - Hydrology & Flood Risk Modeling: hydrology.md
  - RGB Orthos & Crop Vitality: imagery.md
  - 3D Volumetrics & Earthworks: volumetrics.md
  - Examples & Interactive Notebooks: examples.md
  - Full API Reference & Docstrings:
      - Overview: api/index.md
      - AutoQC & Diagnostics: api/autoqc.md
      - Surface Models (DEM): api/dem.md
      - Hydrology & Flood Risk: api/hydrology.md
      - Imagery & Orthomosaics: api/imagery.md
      - Analysis & Volumetrics: api/analysis.md
      - LiDAR & Strip Alignment: api/lidar.md
      - Profiling & Visualizations: api/profiling.md
      - Compute & Hardware Scaling: api/config.md
      - Spatial & CRS Management: api/spatial.md
      - Utilities & Helpers: api/utils.md
