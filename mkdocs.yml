site_name: dronegeo 🛸
site_description: High-Performance Python Remote Sensing, UAV LiDAR, Hydrological Flow & Photogrammetry Processing Toolkit
site_author: STROM Drone Remote Sensing Team
site_url: https://sammygis.github.io/dronegeo/
repo_url: https://github.com/SammyGIS/dronegeo
repo_name: SammyGIS/dronegeo

theme:
  name: material
  logo: images/dronegeo.png
  favicon: images/dronegeo.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - 🏠 Home: index.md
  - 🚀 Quickstart: quickstart.md
  - 🔍 AutoQC & Diagnostics: autoqc.md
  - ⛰️ Surface Models (DTM/DSM/CHM): surfaces.md
  - 🌊 Hydrology & Flood Risk: hydrology.md
  - 🎨 RGB Orthos & Crop Health: imagery.md
  - 📐 Terrain Analysis & Volumetrics: volumetrics.md
  - 📦 Examples Catalog: examples.md
